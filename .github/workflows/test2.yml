name: Test
on:
  workflow_dispatch: # allows manual triggering
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Hardware Check
      run: |
        if ! grep -q "avx512_vnni" /proc/cpuinfo; then
            echo "Architecture: AVX2 (haswell/zen3)"
            exit 1
        elif grep -q "Intel" /proc/cpuinfo; then
            if grep -q "avx512_bf16" /proc/cpuinfo; then
                if lscpu | grep L1i | grep -q "128 KiB"; then
                    echo "Architecture: Granite Rapids"
                else
                    echo "Architecture: Emerald Rapids"
                fi
            else
                if lscpu | grep -q "PLATINUM 8573C"; then
                    echo "No BF16"
                    echo "Architecture: Emerald Rapids"
                fi
                echo "Architecture: Ice Lake"
            fi
        else
            if grep -q "AMD" /proc/cpuinfo; then
                echo "Architecture: Zen 4"
            fi
        fi
        wget -q https://github.com/cora4/ik_llama.cpp/releases/download/spr-25-15909/fma_test
        ./fma_test
        exit
