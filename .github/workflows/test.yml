name: Test

on:
  workflow_dispatch: # allows manual triggering

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - name: Download Dependencies
      id: dl
      run: |
        wget https://github.com/cora4/ik_llama.cpp/releases/download/a/llama-latest-bin-ubuntu-x64.zip
        wget https://github.com/cora4/ik_llama.cpp/releases/download/a/qwen3-1.7B-Q2_0.gguf
        wget https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b9596-9fcaed7/llama-prism-b9596-9fcaed7-bin-ubuntu-x64.tar.gz

    - name: Extract Binaries
      run: |
        unzip -o llama-latest-bin-ubuntu-x64.zip -d /tmp/
        tar --no-overwrite-dir -xf llama-prism-b9596-9fcaed7-bin-ubuntu-x64.tar.gz -C /tmp/ || true

    - name: System Information
      run: |
        echo "Current Directory: $PWD"
        echo "CPU Cores:"
        nproc
        cat /proc/cpuinfo

    - name: Verify Binary Versions
      run: |
        echo "Testing Llama Latest:"
        /tmp/llama-latest/llama-server --version
        echo "Testing Llama Prism:"
        /tmp/llama-prism-b9596-9fcaed7/llama-server --version

    - name: Quantise Model
      run: |
        /tmp/llama-prism-b9596-9fcaed7/llama-quantize \
          --allow-requantize --token-embedding-type iq4_nl \
          --tensor-type attn_k=iq4_nl --tensor-type attn_q=iq4_nl --tensor-type attn_v=iq4_nl \
          --tensor-type ffn_down=iq4_nl --tensor-type ffn_gate=iq4_nl --tensor-type ffn_up=iq4_nl \
          --tensor-type attn_output=iq4_nl qwen3-1.7B-Q2_0.gguf /tmp/qwen3-1.7B-IQ4_NL.gguf iq4_nl

    - name: Benchmark Models (Prism)
      run: |
        echo "Benchmarking Quantised Model (Prism):"
        /tmp/llama-prism-b9596-9fcaed7/llama-bench -m /tmp/qwen3-1.7B-IQ4_NL.gguf
    - name: Benchmark Models (latest)
      run: |
        echo "Benchmarking Quantised Model (Latest):"
        /tmp/llama-latest/llama-bench -m /tmp/qwen3-1.7B-IQ4_NL.gguf
