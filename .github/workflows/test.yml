name: Test

on:
  workflow_dispatch: # allows manual triggering

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Build Dependencies
      id: dl
      run: |
        wget https://github.com/cora4/ik_llama.cpp/releases/download/a/llama-latest-bin-ubuntu-x64.zip
        wget https://github.com/cora4/ik_llama.cpp/releases/download/a/qwen3-1.7B-Q2_0.gguf
        wget https://github.com/PrismML-Eng/llama.cpp/releases/download/prism-b9596-9fcaed7/llama-prism-b9596-9fcaed7-bin-ubuntu-x64.tar.gz
        unzip llama-latest-bin-ubuntu-x64.zip -d /tmp/
        tar --no-overwrite-dir -xf llama-prism-b9596-9fcaed7-bin-ubuntu-x64.tar.gz -C /tmp/||true
    - name: Show nproc
      run: |
        nproc
        cat /proc/cpuinfo
        /tmp/llama-latest/llama-server --version
        /tmp/llama-prism-b9596-9fcaed7/llama-server --version
        /tmp/llama-prism-b9596-9fcaed7/llama-quantize \
          --allow-requantize --token-embedding-type Q4_0 \
          --tensor-type attn_k=q4_0 --tensor-type attn_q=q4_0 --tensor-type attn_v=q4_0 \
          --tensor-type ffn_down=q4_0 --tensor-type ffn_gate=q4_0 --tensor-type ffn_up=q4_0 \
          --tensor-type attn_output=q4_0 /tmp/qwen3-1.7B-Q2_0.gguf /tmp/qwen3-1.7B-Q4_0.gguf q4_0
        /tmp/llama-prism-b9596-9fcaed7/llama-bench -m /tmp/qwen3-1.7B-Q4_0.gguf
        /tmp/llama-latest/llama-bench -m /tmp/qwen3-1.7B-Q4_0.gguf
